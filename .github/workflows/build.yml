name: build

on:
  push:

jobs:
  linux:
    strategy:
      matrix:
        target: [linux-arm64, linux-armhf, linux-i686, linux-riscv64, linux-x86_64]
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # - name: Install git
      #   run: |
      #     apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates curl git openssl
      #     curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git_2.34.1-1ubuntu1~bpo20.04.1~ppa1_amd64.deb
      #     curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git-man_2.34.1-1ubuntu1~bpo20.04.1~ppa1_all.deb
      #     dpkg -i *.deb
      #     rm *.deb
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          target: ${{ matrix.target }}
          extraargs: -DFAUSTDR="~/.local/bin/faustdr"
          dpf_path: ./deps/DPF
          faust: true

  macos:
    strategy:
      matrix:
        target: [macos-universal]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          target: ${{ matrix.target }}
          dpf_path: ./deps/DPF
          faust: true

  windows:
    strategy:
      matrix:
        target: [win32, win64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          target: ${{ matrix.target }}
          dpf_path: ./deps/DPF
          faust: true

  pluginval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          target: pluginval
          dpf_path: ./deps/DPF
          faust: true
